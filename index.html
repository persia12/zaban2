let currentCardEl = null;

function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
}

function stopAudio() {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
    if (currentCardEl) {
        currentCardEl.classList.remove("playing");
        currentCardEl = null;
    }
}

function speakText(text, cardEl = null) {
    if (!('speechSynthesis' in window)) {
        alert("مرورگر شما از قابلیت خوانش صوتی (Speech Synthesis) پشتیبانی نمی‌کند.");
        return;
    }

    stopAudio();

    const accent = document.getElementById("accentSelect").value;
    const rate = parseFloat(document.getElementById("rateRange").value) || 0.8;

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = accent;
    utter.rate = rate;
    utter.pitch = 1.0;

    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
        let bestVoice = voices.find(v => v.lang === accent) ||
                        voices.find(v => v.lang.startsWith(accent.split('-')[0]));
        if (bestVoice) {
            utter.voice = bestVoice;
        }
    }

    if (cardEl) {
        currentCardEl = cardEl;
        cardEl.classList.add("playing");
    }

    utter.onstart = () => {
        showToast("در حال پخش با لهجه " + (accent === 'en-GB' ? 'بریتانیایی' : 'آمریکایی') + " (سرعت " + rate + "x)...");
    };

    utter.onend = () => {
        if (cardEl) cardEl.classList.remove("playing");
    };

    utter.onerror = () => {
        if (cardEl) cardEl.classList.remove("playing");
    };

    window.speechSynthesis.speak(utter);
}

function renderContent() {
    const container = document.getElementById("contentArea");
    let html = "";

    sectionsData.forEach(section => {
        html += `
            <div class="section-header">
                <h2>${section.title}</h2>
                <span class="section-badge">${section.badge}</span>
            </div>
        `;

        section.sentences.forEach(s => {
            const escapedEn = s.en.replace(/'/g, "\\'");
            html += `
                <div class="sentence-card" id="card-${s.id}">
                    <div class="card-num">${s.id}</div>

                    <div class="english-box" onclick="speakText('${escapedEn}', document.getElementById('card-${s.id}'))" title="برای پخش تلفظ با لهجه انگلیسی کلیک کنید">
                        <div class="english-text">${s.en}</div>
                        <div class="audio-icon">${speakerSvg}</div>
                    </div>

                    <div class="pronounce-box">
                        <div class="box-label">${quoteSvg} تلفظ دقیق آوایی (فارسی):</div>
                        <div>${s.pronunciation}</div>
                    </div>

                    <div class="translation-box">
                        <div class="box-label">${checkSvg} ترجمه دقیق تخصصی:</div>
                        <div>${s.translation}</div>
                    </div>

                    <div class="keywords-wrapper">
                        <div class="keywords-title">${tagSvg} تمامی واژگان مهم این جمله به همراه مترادف‌ها:</div>
                        <div class="words-grid">
            `;

            s.words.forEach(w => {
                const escapedWord = w.en.replace(/'/g, "\\'");
                html += `
                    <div class="word-card">
                        <div class="main-word-header">
                            <span class="main-word-en" onclick="speakText('${escapedWord}')" title="پخش تلفظ کلمه">${w.en} ${speakerSvg}</span>
                            <span class="main-word-pron">[تلفظ: ${w.pron}]</span>
                        </div>
                        <div class="main-word-fa">معنی: ${w.fa}</div>

                        <div class="synonyms-box">
                            <div class="synonyms-title">مترادف‌ها (Synonyms):</div>
                `;

                w.synonyms.forEach(syn => {
                    const escapedSyn = syn.en.replace(/'/g, "\\'");
                    html += `
                        <div class="synonym-item">
                            <div class="syn-en-pron">
                                <span class="syn-word" onclick="speakText('${escapedSyn}')" title="پخش تلفظ مترادف">${syn.en}</span>
                                <span class="syn-pron">تلفظ: ${syn.pron}</span>
                            </div>
                            <div class="syn-fa">معنی: ${syn.fa}</div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
            `;
        });
    });

    container.innerHTML = html;
}
